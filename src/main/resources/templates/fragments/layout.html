<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Fragmentos comunes a todas las vistas.
     Uso en una página:
       <head th:replace="~{fragments/layout :: head('Título')}"></head>
       <nav th:replace="~{fragments/layout :: navbar}"></nav>
       <footer th:replace="~{fragments/layout :: footer}"></footer>
       <th:block th:replace="~{fragments/layout :: scripts}"></th:block> -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | TravelGo'">TravelGo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark tg-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-airplane-fill"></i> TravelGo
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/catalogo}">Catálogo</a></li>
            </ul>

            <ul class="navbar-nav align-items-lg-center gap-2">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Iniciar sesión</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="btn btn-light btn-sm" th:href="@{/registro}">Registrarse</a>
                </li>

                <li class="nav-item navbar-text" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-circle"></i> <span sec:authentication="name">usuario</span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <!-- El logout es POST para que Spring Security valide el token CSRF -->
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="tg-footer mt-auto py-3">
    <div class="container text-center small">
        TravelGo · Sistema de Agencias de Viajes · UPC 2026
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
