<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/catalogo}">Catálogo</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/catalogo/{id}(id=${paquete.id})}" th:text="${paquete.nombre}">Paquete</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Reservar</li>
        </ol>
    </nav>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 gap-2">
        <h1 class="h2 mb-0">Arma tu reserva</h1>
        <span class="badge text-bg-warning align-self-start align-self-md-end">Catálogo de ejemplo</span>
    </div>

    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <form th:action="@{/reserva}" method="post">
        <input type="hidden" name="paqueteId" th:value="${paquete.id}">

        <div class="row g-4">
            <div class="col-lg-8">

                <!-- Una sección por tipo de servicio reservable: Vuelo, Hotel y Transporte -->
                <div class="card tg-card mb-4">
                    <div class="card-body p-4">
                        <h2 class="h5"><i class="bi bi-airplane"></i> Vuelo</h2>
                        <label class="card tg-opcion p-3 mb-2" th:each="vuelo : ${vuelos}">
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="radio" name="vueloId"
                                       th:value="${vuelo.id}" th:attr="data-precio=${vuelo.calcularPrecio()}">
                                <div class="flex-grow-1">
                                    <div class="fw-semibold"
                                         th:text="${vuelo.aerolinea + ' · ' + vuelo.origen + ' → ' + vuelo.destino}">Vuelo</div>
                                    <div class="text-muted small"
                                         th:text="${'Sale ' + #temporals.format(vuelo.fechaSalida, 'dd/MM/yyyy HH:mm') + ' · llega ' + #temporals.format(vuelo.fechaLlegada, 'HH:mm')}">Fechas</div>
                                </div>
                                <span class="fw-semibold"
                                      th:text="${'+ USD ' + #numbers.formatDecimal(vuelo.calcularPrecio(), 1, 'COMMA', 2, 'POINT')}">+ USD 0.00</span>
                            </div>
                        </label>
                        <label class="card tg-opcion p-3">
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="radio" name="vueloId" value="" data-precio="0" checked>
                                <span class="text-muted">Sin vuelo</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="card tg-card mb-4">
                    <div class="card-body p-4">
                        <h2 class="h5"><i class="bi bi-building"></i> Hotel</h2>
                        <label class="card tg-opcion p-3 mb-2" th:each="hotel : ${hoteles}">
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="radio" name="hotelId"
                                       th:value="${hotel.id}" th:attr="data-precio=${hotel.calcularPrecio()}">
                                <div class="flex-grow-1">
                                    <div class="fw-semibold" th:text="${hotel.nombre}">Hotel</div>
                                    <div class="text-muted small"
                                         th:text="${hotel.tipoHabitacion + ' · ' + hotel.direccion}">Detalle</div>
                                    <div class="text-muted small"
                                         th:text="${'USD ' + #numbers.formatDecimal(hotel.precio, 1, 'COMMA', 2, 'POINT') + ' / noche · ' + hotel.noches + ' noches'}">Precio por noche</div>
                                </div>
                                <span class="fw-semibold"
                                      th:text="${'+ USD ' + #numbers.formatDecimal(hotel.calcularPrecio(), 1, 'COMMA', 2, 'POINT')}">+ USD 0.00</span>
                            </div>
                        </label>
                        <label class="card tg-opcion p-3">
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="radio" name="hotelId" value="" data-precio="0" checked>
                                <span class="text-muted">Sin hotel</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="card tg-card">
                    <div class="card-body p-4">
                        <h2 class="h5"><i class="bi bi-car-front"></i> Transporte</h2>
                        <label class="card tg-opcion p-3 mb-2" th:each="transporte : ${transportes}">
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="radio" name="transporteId"
                                       th:value="${transporte.id}" th:attr="data-precio=${transporte.calcularPrecio()}">
                                <div class="flex-grow-1">
                                    <div class="fw-semibold" th:text="${transporte.tipo}">Transporte</div>
                                    <div class="text-muted small"
                                         th:text="${transporte.origen + ' → ' + transporte.destino + ' · ' + #temporals.format(transporte.fecha, 'dd/MM/yyyy HH:mm')}">Detalle</div>
                                </div>
                                <span class="fw-semibold"
                                      th:text="${'+ USD ' + #numbers.formatDecimal(transporte.calcularPrecio(), 1, 'COMMA', 2, 'POINT')}">+ USD 0.00</span>
                            </div>
                        </label>
                        <label class="card tg-opcion p-3">
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="radio" name="transporteId" value="" data-precio="0" checked>
                                <span class="text-muted">Sin transporte</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card tg-card tg-resumen">
                    <div class="card-body p-4">
                        <h2 class="h5">Resumen</h2>
                        <p class="mb-1 fw-semibold" th:text="${paquete.nombre}">Paquete</p>
                        <p class="text-muted small"
                           th:text="${paquete.destino.ciudad + ' · ' + paquete.duracionDias + ' días'}">Destino · días</p>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <span>Paquete</span>
                            <span th:text="${'USD ' + #numbers.formatDecimal(paquete.precio, 1, 'COMMA', 2, 'POINT')}">USD 0.00</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span>Servicios extra</span>
                            <span id="extras">USD 0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fw-semibold">Total</span>
                            <span id="total" class="tg-precio" th:attr="data-base=${paquete.precio}"
                                  th:text="${'USD ' + #numbers.formatDecimal(paquete.precio, 1, 'COMMA', 2, 'POINT')}">USD 0.00</span>
                        </div>
                        <button type="submit" class="btn btn-tg w-100">Confirmar reserva</button>
                        <!-- Quitar este aviso cuando Reserva.calcularTotal() sume también el precio del paquete -->
                        <p class="text-muted small mt-2 mb-0">
                            Por ahora el total a pagar solo suma los servicios, no el precio del paquete.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/reserva.js}"></script>
</body>
</html>
