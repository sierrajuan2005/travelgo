<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="d-flex align-items-center justify-content-center py-5">
    <div class="card tg-auth-card">
        <div class="card-header text-center">
            <i class="bi bi-airplane-fill fs-1 text-primary"></i>
            <h1 class="h4 mt-2">Iniciar sesión</h1>
        </div>
        <div class="card-body px-4 pb-4">

            <div th:if="${param.error}" class="alert alert-danger py-2">
                Correo o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-info py-2">
                Cerraste sesión correctamente.
            </div>
            <div th:if="${param.registrado}" class="alert alert-success py-2">
                Cuenta creada. Ya puedes iniciar sesión.
            </div>

            <!-- Spring Security espera los parámetros "username" y "password";
                 th:action agrega el token CSRF automáticamente -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Correo electrónico</label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="tucorreo@ejemplo.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-tg w-100">Ingresar</button>
            </form>

            <p class="text-center mt-3 mb-0 small">
                ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
