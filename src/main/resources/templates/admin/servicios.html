<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Administración · Servicios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 gap-2">
        <h1 class="h2 mb-0">Panel de administración</h1>
        <span class="badge text-bg-warning align-self-start align-self-md-end">Catálogo de ejemplo</span>
    </div>
    <ul th:replace="~{fragments/layout :: adminTabs('servicios')}"></ul>

    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <p th:if="${paquete == null}" class="text-muted">No hay paquetes activos.</p>

    <th:block th:if="${paquete != null}">
        <form th:action="@{/admin/servicios}" method="get" class="row g-2 align-items-end mb-4">
            <div class="col-md-6">
                <label for="paquete" class="form-label small">Paquete</label>
                <select id="paquete" name="paquete" class="form-select" onchange="this.form.submit()">
                    <option th:each="p : ${paquetes}" th:value="${p.id}" th:text="${p.nombre}"
                            th:selected="${p.id == paquete.id}">Paquete</option>
                </select>
            </div>
            <div class="col-md-6">
                <p class="text-muted small mb-0">
                    Los servicios no disponibles no aparecen al armar una reserva.
                </p>
            </div>
        </form>

        <div class="card tg-card">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Id</th>
                        <th>Servicio</th>
                        <th class="text-end">Precio</th>
                        <th>Estado</th>
                        <th class="text-end">Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="servicio : ${servicios}">
                        <td><code th:text="${servicio.id}">v1</code></td>
                        <td th:text="${servicio.describir()}">Servicio</td>
                        <td class="text-end"
                            th:text="${'USD ' + #numbers.formatDecimal(servicio.calcularPrecio(), 1, 'COMMA', 2, 'POINT')}">USD 0.00</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${servicio.disponible} ? 'text-bg-success' : 'text-bg-secondary'"
                                  th:text="${servicio.disponible} ? 'Disponible' : 'No disponible'">Disponible</span>
                        </td>
                        <td class="text-end">
                            <form th:action="@{/admin/servicios/{p}/{s}/disponibilidad(p=${paquete.id}, s=${servicio.id})}"
                                  method="post">
                                <button type="submit" class="btn btn-outline-secondary btn-sm"
                                        th:text="${servicio.disponible} ? 'Marcar no disponible' : 'Marcar disponible'">
                                    Cambiar
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </th:block>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
