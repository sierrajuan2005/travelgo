<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Administración · Destinos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 gap-2">
        <h1 class="h2 mb-0">Panel de administración</h1>
        <span class="badge text-bg-warning align-self-start align-self-md-end">Catálogo de ejemplo</span>
    </div>
    <ul th:replace="~{fragments/layout :: adminTabs('destinos')}"></ul>

    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card tg-card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nombre</th>
                            <th>Ciudad, país</th>
                            <th class="text-end">Acción</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="destino : ${destinos}">
                            <td><code th:text="${destino.id}">d1</code></td>
                            <td>
                                <div class="fw-semibold" th:text="${destino.nombre}">Nombre</div>
                                <div class="text-muted small" th:text="${destino.descripcion}">Descripción</div>
                            </td>
                            <td th:text="${destino.ciudad + ', ' + destino.pais}">Ciudad, País</td>
                            <td class="text-end">
                                <!-- No se elimina un destino que tiene paquetes: el controlador muestra el motivo -->
                                <form th:action="@{/admin/destinos/{id}/eliminar(id=${destino.id})}" method="post"
                                      onsubmit="return confirm('¿Eliminar este destino?')">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card tg-card">
                <div class="card-body p-4">
                    <h2 class="h5">Agregar destino</h2>
                    <form th:action="@{/admin/destinos}" method="post">
                        <div class="mb-2">
                            <label for="nombre" class="form-label small">Nombre</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label for="descripcion" class="form-label small">Descripción</label>
                            <textarea id="descripcion" name="descripcion" class="form-control" rows="2" required></textarea>
                        </div>
                        <div class="mb-2">
                            <label for="pais" class="form-label small">País</label>
                            <input type="text" id="pais" name="pais" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="ciudad" class="form-label small">Ciudad</label>
                            <input type="text" id="ciudad" name="ciudad" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-tg w-100"><i class="bi bi-plus-lg"></i> Agregar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
