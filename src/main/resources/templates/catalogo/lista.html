<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catálogo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main>
    <section class="tg-encabezado">
        <div class="container position-relative">
            <span class="tg-eyebrow text-white-50">Catálogo</span>
            <h1 class="display-6 mb-2">Paquetes turísticos</h1>
            <p class="mb-0">Elige tu próximo destino. Precios de referencia en pesos colombianos (COP).</p>
        </div>
    </section>

    <div class="container tg-sube">
        <!-- Filtros: destino, precio y duración -->
        <form th:action="@{/catalogo}" method="get" class="card tg-card tg-filtros p-3 p-md-4 mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="destino" class="form-label small">Destino</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-3"><i class="bi bi-geo-alt"></i></span>
                        <input type="text" id="destino" name="destino" class="form-control border-start-0"
                               th:value="${destino}" placeholder="Ciudad o país">
                    </div>
                </div>
                <div class="col-6 col-md-2">
                    <label for="precioMin" class="form-label small">Precio mínimo</label>
                    <input type="number" id="precioMin" name="precioMin" class="form-control" min="0" step="1000"
                           th:value="${precioMin}" placeholder="$">
                </div>
                <div class="col-6 col-md-2">
                    <label for="precioMax" class="form-label small">Precio máximo</label>
                    <input type="number" id="precioMax" name="precioMax" class="form-control" min="0" step="1000"
                           th:value="${precioMax}" placeholder="$">
                </div>
                <div class="col-6 col-md-2">
                    <label for="duracionMax" class="form-label small">Máximo de días</label>
                    <input type="number" id="duracionMax" name="duracionMax" class="form-control" min="1" max="60"
                           th:value="${duracionMax}">
                </div>
                <div class="col-6 col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-tg-acento flex-grow-1"><i class="bi bi-search"></i> Filtrar</button>
                    <a th:href="@{/catalogo}" class="btn btn-outline-secondary px-3" title="Quitar filtros"
                       aria-label="Quitar filtros"><i class="bi bi-x-lg"></i></a>
                </div>
            </div>
        </form>

        <p class="text-muted small mb-3" th:unless="${#lists.isEmpty(paquetes)}"
           th:text="${#lists.size(paquetes) == 1 ? '1 paquete encontrado' : #lists.size(paquetes) + ' paquetes encontrados'}">5 paquetes</p>

        <div th:if="${#lists.isEmpty(paquetes)}" class="text-center py-5">
            <span class="tg-error-icon mb-3"><i class="bi bi-binoculars"></i></span>
            <h2 class="h4">No hay paquetes con esos filtros</h2>
            <a class="btn btn-tg mt-2" th:href="@{/catalogo}">Ver todos los paquetes</a>
        </div>

        <div class="row g-4">
            <div class="col-sm-6 col-lg-4 tg-aparece" th:each="paquete : ${paquetes}"
                 th:with="foto=${fotos.get(paquete.id)}">
                <a class="card tg-card tg-card-paquete h-100" th:href="@{/catalogo/{id}(id=${paquete.id})}">
                    <!-- Foto real del destino (Wikimedia Commons); el crédito sale al pasar el mouse por (i) -->
                    <div th:if="${foto != null}" class="tg-card-foto">
                        <img th:src="${foto.url()}" th:alt="${'Foto de ' + @formato.destinos(paquete)}" loading="lazy">
                        <span class="tg-info-foto" data-bs-toggle="tooltip" aria-label="Crédito de la foto"
                              th:title="${'Foto: ' + foto.autor() + (foto.licencia() != null ? ' · ' + foto.licencia() : '') + ' (Wikimedia Commons)'}">
                            <i class="bi bi-info-lg"></i></span>
                    </div>
                    <div th:unless="${foto != null}" class="tg-card-img"><i class="bi bi-image-alt"></i></div>
                    <span class="tg-chip"><i class="bi bi-clock"></i> <span th:text="${paquete.duracionDias + ' días'}">5 días</span></span>
                    <span th:if="${reales.contains(paquete.id)}" class="tg-chip" style="left: auto; right: 1.25rem; background: var(--tg-violeta); color: #fff;">
                        <i class="bi bi-patch-check-fill"></i> Datos reales</span>

                    <div class="card-body p-4 d-flex flex-column">
                        <div class="small text-muted mb-1">
                            <i class="bi bi-geo-alt"></i> <span th:text="${@formato.destinos(paquete)}">Destino, País</span>
                        </div>
                        <h2 class="h5 mb-2" th:text="${paquete.nombre}">Nombre del paquete</h2>
                        <p class="small text-muted flex-grow-1 mb-3" th:text="${paquete.descripcion}">Descripción</p>
                        <div class="d-flex justify-content-between align-items-end gap-2">
                            <div>
                                <div class="small text-muted">Precio de referencia</div>
                                <div class="tg-precio" th:text="${@formato.cop(paquete.precio)}">$ 0</div>
                            </div>
                            <span class="tg-ver"><i class="bi bi-arrow-right"></i></span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
