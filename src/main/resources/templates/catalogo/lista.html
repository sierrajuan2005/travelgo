<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catálogo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 gap-2">
        <div>
            <h1 class="h2 mb-1">Paquetes turísticos</h1>
            <p class="text-muted mb-0">Elige tu próximo destino.</p>
        </div>
        <span class="badge text-bg-warning align-self-start align-self-md-end">Maqueta · datos de ejemplo</span>
    </div>

    <div th:if="${param.reservado}" class="alert alert-success">
        <i class="bi bi-check-circle-fill"></i>
        Reserva enviada (maqueta). En el Sprint 2 se guardará de verdad.
    </div>

    <div class="row g-4">
        <div class="col-sm-6 col-lg-4" th:each="paquete : ${paquetes}">
            <div class="card tg-card h-100">
                <div class="tg-card-img"><i class="bi" th:classappend="${paquete.icono}"></i></div>
                <div class="card-body d-flex flex-column">
                    <h2 class="h5 card-title" th:text="${paquete.nombre}">Nombre del paquete</h2>
                    <p class="text-muted small mb-2">
                        <i class="bi bi-geo-alt"></i>
                        <span th:text="${paquete.destino + ', ' + paquete.pais}">Destino, País</span>
                        · <span th:text="${paquete.duracionDias + ' días'}">5 días</span>
                    </p>
                    <p class="card-text small flex-grow-1" th:text="${paquete.descripcion}">Descripción</p>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="tg-precio"
                              th:text="${'USD ' + #numbers.formatDecimal(paquete.precio, 1, 'COMMA', 2, 'POINT')}">USD 0.00</span>
                        <a class="btn btn-tg btn-sm" th:href="@{/catalogo/{id}(id=${paquete.id})}">Ver detalle</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
